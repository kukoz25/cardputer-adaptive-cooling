
name: Build Cardio54 Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile firmware
        run: pio run -e cardputer_adv

      - name: Package firmware
        run: |
          mkdir -p dist
          cp .pio/build/cardputer_adv/firmware.bin \
            dist/Cardio54-Cardputer-ADV.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Cardio54-Cardputer-ADV
          path: dist/Cardio54-Cardputer-ADV.bin
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Cardio54-Cardputer-ADV.bin
          generate_release_notes: true

