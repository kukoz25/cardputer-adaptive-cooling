name: Build Cardio54 Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build for Cardputer-Adv
        run: pio run -e cardputer_adv
      - name: Prepare firmware file
        run: |
          mkdir -p dist
          cp .pio/build/cardputer_adv/firmware.bin dist/Cardio54-Cardputer-ADV.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Cardio54-Cardputer-ADV
          path: dist/Cardio54-Cardputer-ADV.bin
          if-no-files-found: error
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cardio54-Cardputer-ADV.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The tag job needs write permission to attach release assets.
        # See job-level permissions below.
    permissions:
      contents: write
